[project]
name = "localscript"
version = "0.1.0"
description = "Local TokScript-style tool: turn speech from any TikTok, Reel or YouTube/Shorts video into text. Runs fully on your machine."
requires-python = ">=3.10,<3.14"
dependencies = [
  # [default] bundles yt-dlp-ejs, the local YouTube challenge solver (run with node), so nothing is fetched at runtime.
  # [curl-cffi] lets yt-dlp impersonate a real browser's TLS fingerprint, which TikTok requires.
  "yt-dlp[default,curl-cffi]>=2025.11.1",
  "mlx-whisper>=0.4.2",
  "numpy>=1.26",
  "pywebview>=5.3; sys_platform == 'darwin'",  # native window (WKWebView) for the desktop app
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.scripts]
localscript = "localscript.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["localscript"]
