<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalScript</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8453c'/%3E%3Cpath d='M8 12h16M8 17h16M8 22h10' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --surface-2: #faf9f7; --text: #1a1a1a; --muted: #6a6a6a;
    --line: #e5e3de; --accent: #e8453c; --accent-ink: #ffffff; --accent-soft: #fdecea;
    --ok: #17803f; --ok-soft: #e3f4ea; --warn: #9a5b00; --warn-soft: #fcf0d9; --err: #b3261e; --err-soft: #fbe7e5;
    --radius: 14px; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101011; --surface: #19191b; --surface-2: #1f1f22; --text: #ececec; --muted: #9b9ba1;
      --line: #2c2c30; --accent: #ff5d52; --accent-ink: #1a0503; --accent-soft: #3a1a18;
      --ok: #4cc983; --ok-soft: #14291d; --warn: #e5a53f; --warn-soft: #2e2410; --err: #ff7468; --err-soft: #331816;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 16px 80px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; flex: none; }
  h1 { font-size: 22px; letter-spacing: -.02em; margin: 0; line-height: 1.1; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
  .badge-local { margin-left: auto; font-size: 12px; color: var(--ok); background: var(--ok-soft); padding: 4px 10px; border-radius: 99px; white-space: nowrap; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .input-panel { padding: 16px; }
  textarea#urls {
    width: 100%; min-height: 104px; resize: vertical; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  textarea#urls:focus, select:focus, input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .hint { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12.5px; margin: 6px 2px 12px; flex-wrap: wrap; }
  .opts { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 14px; }
  .opts label { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--text); }
  .opts label.col { flex-direction: column; align-items: flex-start; gap: 3px; font-size: 12px; color: var(--muted); max-width: 100%; min-width: 0; }
  .opts label.col select { max-width: 100%; min-width: 0; text-overflow: ellipsis; }
  select, input[type=search] {
    font: inherit; font-size: 13.5px; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 100%;
  }
  .actions { display: flex; align-items: center; gap: 12px; }
  button { font: inherit; cursor: pointer; }
  .btn-primary {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
    padding: 10px 20px; font-weight: 600; font-size: 15px;
  }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-primary:disabled { opacity: .5; cursor: default; }
  .kbd { font-size: 12px; color: var(--muted); }
  .btn { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 13px; text-decoration: none; display: inline-block; }
  .btn:hover { border-color: var(--muted); }
  .btn:disabled { opacity: .45; cursor: default; }
  .icon-btn { background: none; border: 0; color: var(--muted); padding: 6px; border-radius: 8px; line-height: 1; font-size: 17px; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn.on { color: #e5a53f; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 28px 0 12px; }
  .bar h2 { font-size: 15px; margin: 0; letter-spacing: -.01em; }
  .bar .spacer { flex: 1; }
  .bar input[type=search] { width: 190px; }
  .chip-toggle { display: inline-flex; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .chip-toggle button { background: var(--surface); color: var(--muted); border: 0; padding: 5px 11px; font-size: 13px; }
  .chip-toggle button.on { background: var(--text); color: var(--bg); }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .row { display: flex; gap: 12px; padding: 12px; align-items: flex-start; }
  .row.clickable { cursor: pointer; }
  .row.clickable:hover { background: var(--surface-2); }
  .pick { margin-top: 4px; accent-color: var(--accent); }
  .thumb { width: 56px; height: 76px; border-radius: 8px; background: var(--surface-2) center/cover no-repeat; border: 1px solid var(--line); flex: none; display: grid; place-items: center; color: var(--muted); font-size: 20px; }
  .main { flex: 1; min-width: 0; }
  .title { font-weight: 600; font-size: 14.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .tag { font-size: 11px; font-weight: 600; letter-spacing: .02em; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text); }
  .tag.tiktok { background: #101010; color: #fff; border-color: #101010; }
  .tag.instagram { background: #fdeaf3; color: #b0245f; border-color: #f6cde0; }
  .tag.youtube, .tag.shorts { background: #fdeaea; color: #c4170c; border-color: #f7cdcb; }
  @media (prefers-color-scheme: dark) {
    .tag.tiktok { background: #fff; color: #101010; border-color: #fff; }
    .tag.instagram { background: #3a1a2a; color: #ff8fbb; border-color: #4f2338; }
    .tag.youtube, .tag.shorts { background: #3a1a18; color: #ff8a80; border-color: #512320; }
  }
  .preview { margin-top: 6px; color: var(--text); opacity: .85; font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .preview.none { color: var(--muted); font-style: italic; }
  .card.open .preview { display: none; }
  .state { margin-top: 6px; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; padding: 3px 10px; border-radius: 99px; }
  .state.queued { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
  .state.run { background: var(--warn-soft); color: var(--warn); }
  .err { margin-top: 6px; font-size: 13px; color: var(--err); background: var(--err-soft); padding: 8px 10px; border-radius: 8px; word-break: break-word; white-space: pre-wrap; }
  .spin { width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
  .acts { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; }
  .acts-row { display: flex; }

  .body { border-top: 1px solid var(--line); padding: 14px 14px 16px; background: var(--surface-2); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 12px; }
  .tools .grp { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .tools .lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
  .tools label { font-size: 13px; display: inline-flex; gap: 5px; align-items: center; }
  .transcript { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; max-height: 420px; overflow: auto; font-size: 15px; line-height: 1.65; user-select: text; }
  .transcript p { margin: 0; white-space: pre-wrap; }
  .seg { display: flex; gap: 12px; padding: 3px 0; }
  .seg time { color: var(--accent); font: 12.5px/1.9 ui-monospace, Menlo, monospace; flex: none; width: 38px; }
  .meta-line { color: var(--muted); font-size: 12.5px; margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .meta-line a { color: var(--muted); }

  .empty { text-align: center; color: var(--muted); padding: 44px 16px; border: 1px dashed var(--line); border-radius: var(--radius); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.25); z-index: 9; max-width: calc(100% - 32px); }
  [hidden] { display: none !important; }
  @media (max-width: 560px) {
    .bar input[type=search] { width: 100%; order: 5; }
    .badge-local { display: none; }
    .thumb { width: 46px; height: 62px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 8h16M4 13h16M4 18h10"/></svg>
    </div>
    <div>
      <h1>LocalScript</h1>
      <p>Speech to text for TikTok, Reels &amp; YouTube Shorts</p>
    </div>
    <span class="badge-local" title="Videos are downloaded and transcribed on this computer. Nothing is uploaded.">● Runs on this Mac</span>
  </header>

  <section class="panel input-panel" aria-label="New transcription">
    <textarea id="urls" spellcheck="false" aria-label="Video links"
      placeholder="Paste links — one per line (up to 50 at once)&#10;https://www.tiktok.com/@user/video/…&#10;https://www.instagram.com/reel/…&#10;https://www.youtube.com/shorts/…&#10;Profiles, playlists &amp; TikTok collections work too"></textarea>
    <div class="hint"><span id="count">No links yet</span><span>Works with any link yt-dlp supports</span></div>

    <div class="opts">
      <label class="col">Model
        <select id="model"></select>
      </label>
      <label class="col">Spoken language
        <select id="language">
          <option value="">Auto-detect</option>
        </select>
      </label>
      <label class="col" title="Browser whose logged-in session yt-dlp should borrow (needed for some Instagram / private videos)">Sign-in
        <select id="cookies">
          <option value="">None</option>
          <option value="chrome">Use my Chrome cookies</option>
          <option value="safari">Use my Safari cookies</option>
          <option value="firefox">Use my Firefox cookies</option>
          <option value="brave">Use my Brave cookies</option>
          <option value="edge">Use my Edge cookies</option>
        </select>
      </label>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="translate"> Translate to English</label>
      <span class="kbd" id="tr-note" hidden></span>
      <label><input type="checkbox" id="save_video"> Save HD video</label>
      <label title="Turn profile, playlist and collection links into their individual videos"><input type="checkbox" id="expand" checked> Expand profiles &amp; playlists</label>
    </div>
    <div class="actions">
      <button class="btn-primary" id="go">Transcribe</button>
      <span class="kbd">⌘ Enter</span>
    </div>
  </section>

  <div class="bar">
    <h2>History</h2>
    <div class="chip-toggle" role="group" aria-label="Filter">
      <button id="f-all" class="on">All</button><button id="f-star">★ Bookmarked</button>
    </div>
    <input type="search" id="q" placeholder="Search transcripts…" aria-label="Search history">
    <span class="spacer"></span>
    <button class="btn" id="sel-all">Select all</button>
    <select id="bulk-fmt" aria-label="Bulk export format">
      <option value="txt">TXT</option><option value="srt">SRT</option><option value="vtt">VTT</option>
      <option value="json">JSON</option><option value="csv">CSV</option><option value="xml">XML</option>
    </select>
    <button class="btn" id="bulk" disabled>Export selected (.zip)</button>
  </div>

  <div class="list" id="list" aria-live="polite"></div>
  <div class="empty" id="empty" hidden>Nothing here yet. Paste a link above to get your first transcript.</div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LANGS = {en:'English',es:'Spanish',pt:'Portuguese',fr:'French',de:'German',it:'Italian',nl:'Dutch',ru:'Russian',uk:'Ukrainian',pl:'Polish',tr:'Turkish',ar:'Arabic',hi:'Hindi',id:'Indonesian',vi:'Vietnamese',th:'Thai',ja:'Japanese',ko:'Korean',zh:'Chinese',sv:'Swedish'};
const PLAT = {tiktok:'TikTok',instagram:'Reels',youtube:'YouTube',shorts:'Shorts',facebook:'Facebook',x:'X',other:'Video'};
const FORMATS = ['txt','srt','vtt','json','csv','xml'];
const ACTIVE = new Set(['queued','downloading','transcribing']);

const state = { jobs: [], expanded: new Set(), details: new Map(), selected: new Set(), starred: false, q: '', ts: false, timer: null };

// ---------- helpers
const store = {
  get(k, d) { try { const v = localStorage.getItem('ls.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('ls.' + k, JSON.stringify(v)); } catch {} },
};
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!r.ok) {
    let m; try { m = (await r.json()).detail; } catch { m = r.statusText; }
    throw new Error(typeof m === 'string' ? m : JSON.stringify(m));
  }
  return r.json();
}
let toastTimer;
function toast(msg, ms = 3500) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, ms);
}
const fmtDur = s => s == null ? '' : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const fmtNum = n => n == null ? '' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n);
const safeHref = u => /^https?:\/\//i.test(u || '') ? u : '#';
function countUrls(text) {
  return new Set((text.match(/(https?:\/\/[^\s,<>"']+|(?:[\w-]+\.)*(?:tiktok\.com|instagram\.com|youtube\.com|youtu\.be)\/[^\s,<>"']+)/gi) || [])).size;
}

// ---------- setup
const langSel = $('#language');
for (const [k, v] of Object.entries(LANGS)) langSel.add(new Option(v, k));

let MODELS = [];
async function loadModels() {
  const { default: def, models } = await api('/api/models');
  MODELS = models;
  const sel = $('#model'); sel.innerHTML = '';
  for (const m of models) {
    const state = !m.available ? '' : m.cached ? ' ✓' : ' (downloads on first use)';
    const opt = new Option(`${m.id} — ${m.info}${state}`, m.id);
    opt.disabled = !m.available;
    sel.add(opt);
  }
  sel.value = store.get('model', def);
  if (!sel.value || sel.selectedOptions[0]?.disabled) sel.value = def;
  updateNote();
}
// Neither Parakeet nor large-v3-turbo can translate, so the server switches to Whisper large-v3 — say so up front.
function updateNote() {
  const note = $('#tr-note');
  if ($('#translate').checked && ['auto', 'parakeet-ultra', 'large-v3-turbo'].includes($('#model').value)) {
    const v3 = MODELS.find(m => m.id === 'large-v3');
    note.textContent = '· translation uses Whisper large-v3' + (v3 && !v3.cached ? ' (~3 GB download on first use)' : '');
    note.hidden = false;
  } else note.hidden = true;
}
for (const id of ['model', 'language', 'cookies']) $('#' + id).addEventListener('change', e => { store.set(id, e.target.value); updateNote(); });
for (const id of ['translate', 'save_video', 'expand']) $('#' + id).addEventListener('change', e => { store.set(id, e.target.checked); updateNote(); });
function restoreOpts() {
  $('#language').value = store.get('language', '');
  $('#cookies').value = store.get('cookies', '');
  for (const id of ['translate', 'save_video']) $('#' + id).checked = store.get(id, false);
  $('#expand').checked = store.get('expand', true);
}

$('#urls').addEventListener('input', e => {
  const n = countUrls(e.target.value);
  $('#count').textContent = n ? `${n} link${n > 1 ? 's' : ''} detected` : 'No links yet';
});
$('#urls').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) submit(); });
$('#go').addEventListener('click', submit);

async function submit() {
  const text = $('#urls').value.trim();
  if (!text) return toast('Paste at least one video link first.');
  const btn = $('#go'); btn.disabled = true; btn.textContent = 'Adding…';
  try {
    const r = await api('/api/jobs', { method: 'POST', body: JSON.stringify({
      text, model: $('#model').value, language: $('#language').value || null,
      translate: $('#translate').checked, save_video: $('#save_video').checked,
      expand: $('#expand').checked, cookies_browser: $('#cookies').value || null,
    }) });
    $('#urls').value = ''; $('#count').textContent = 'No links yet';
    const cached = r.jobs.filter(j => j.cached).length, fresh = r.jobs.length - cached;
    let msg = fresh ? `Queued ${fresh} video${fresh > 1 ? 's' : ''}` : '';
    if (cached) msg += `${msg ? ' · ' : ''}${cached} already in history`;
    if (r.notes?.length) msg += ` · ${r.notes[0]}`;
    toast(msg);
    if (r.jobs.length === 1) state.expanded.add(r.jobs[0].id);
    await refresh();
  } catch (e) { toast(e.message, 7000); }
  finally { btn.disabled = false; btn.textContent = 'Transcribe'; }
}

// ---------- history list
async function refresh() {
  try {
    const qs = new URLSearchParams(); if (state.q) qs.set('q', state.q); if (state.starred) qs.set('starred', 'true');
    const { jobs } = await api('/api/jobs?' + qs);
    // invalidate cached details of jobs whose status changed
    for (const j of jobs) {
      const old = state.jobs.find(o => o.id === j.id);
      if (old && old.status !== j.status) state.details.delete(j.id);
    }
    state.jobs = jobs;
    for (const id of [...state.selected]) if (!jobs.some(j => j.id === id && j.status === 'done')) state.selected.delete(id);
    render();
  } catch (e) { /* server restarting — try again on next tick */ }
  schedule();
}
function schedule() {
  clearTimeout(state.timer);
  const busy = state.jobs.some(j => ACTIVE.has(j.status));
  state.timer = setTimeout(() => { if (!document.hidden) refresh(); else schedule(); }, busy ? 1200 : 6000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

function rowHTML(j) {
  const m = j.meta || {};
  const done = j.status === 'done';
  const title = m.title || j.url;
  const thumb = j.files?.cover ? `style="background-image:url('/api/jobs/${j.id}/cover')"` : '';
  const sub = [
    `<span class="tag ${esc(j.platform)}">${esc(PLAT[j.platform] || 'Video')}</span>`,
    m.uploader ? esc(m.uploader) : '',
    m.duration != null ? fmtDur(m.duration) : '',
    m.view_count != null ? `${fmtNum(m.view_count)} views` : '',
    done && j.language ? `<span class="tag">${esc(j.language.toUpperCase())}${j.options?.translate ? ' → EN' : ''}</span>` : '',
    done && j.model ? esc(j.model) : '',
    done && j.elapsed ? `${j.elapsed}s` : '',
  ].filter(Boolean).join('<span>·</span>');
  let status = '';
  if (j.status === 'queued') status = `<div class="state queued">Queued</div>`;
  else if (j.status === 'downloading' || j.status === 'transcribing')
    status = `<div class="state run"><span class="spin"></span>${esc(j.detail || (j.status === 'downloading' ? 'Downloading…' : 'Transcribing…'))}</div>`;
  else if (j.status === 'error') status = `<div class="err">${esc(j.error || 'Failed')}</div>`;
  else if (done) status = j.text_len ? `<div class="preview">${esc(j.preview)}${j.text_len > 220 ? '…' : ''}</div>` : `<div class="preview none">No speech detected (music or silence)</div>`;
  const pick = done ? `<input class="pick" type="checkbox" data-act="pick" aria-label="Select" ${state.selected.has(j.id) ? 'checked' : ''}>` : '';
  const retry = j.status === 'error' ? `<button class="icon-btn" data-act="retry" title="Retry">↻</button>` : '';
  const running = j.status === 'downloading' || j.status === 'transcribing';
  return `${pick}<div class="thumb" ${thumb}>${thumb ? '' : '▶'}</div>
    <div class="main"><div class="title">${esc(title)}</div><div class="sub">${sub}</div>${status}</div>
    <div class="acts"><div class="acts-row">
      ${retry}
      <button class="icon-btn ${j.starred ? 'on' : ''}" data-act="star" title="Bookmark" aria-pressed="${j.starred}">${j.starred ? '★' : '☆'}</button>
      <button class="icon-btn" data-act="del" title="${running ? 'Wait for it to finish' : 'Delete'}" ${running ? 'disabled' : ''}>✕</button>
    </div></div>`;
}

function render() {
  const list = $('#list');
  const ids = state.jobs.map(j => j.id);
  for (const el of [...list.children]) if (!ids.includes(el.dataset.id)) el.remove();
  state.jobs.forEach((j, i) => {
    let el = list.querySelector(`[data-id="${j.id}"]`);
    if (!el) {
      el = document.createElement('article'); el.className = 'card'; el.dataset.id = j.id;
      el.innerHTML = '<div class="row"></div><div class="body" hidden></div>';
    }
    const ref = list.children[i];
    if (ref !== el) list.insertBefore(el, ref || null);
    const row = $('.row', el);
    const sig = JSON.stringify([j.status, j.detail, j.error, j.starred, j.preview, j.meta?.title, j.files, state.selected.has(j.id)]);
    if (el._sig !== sig) { el._sig = sig; row.innerHTML = rowHTML(j); }
    row.classList.toggle('clickable', j.status === 'done');
    el.classList.toggle('open', j.status === 'done' && state.expanded.has(j.id));
    syncBody(el, j);
  });
  $('#empty').hidden = state.jobs.length > 0;
  $('#empty').textContent = (state.q || state.starred) ? 'No matching transcripts.' : 'Nothing here yet. Paste a link above to get your first transcript.';
  const n = state.selected.size;
  $('#bulk').disabled = n === 0; $('#bulk').textContent = n ? `Export ${n} selected (.zip)` : 'Export selected (.zip)';
}

// ---------- expanded transcript
function syncBody(el, j) {
  const body = $('.body', el);
  const open = state.expanded.has(j.id) && j.status === 'done';
  body.hidden = !open;
  if (!open) return;
  const d = state.details.get(j.id);
  if (!d) {
    if (!el._loading) {
      el._loading = true;
      api('/api/jobs/' + j.id).then(full => { state.details.set(j.id, full); el._bodyKey = null; render(); })
        .catch(e => toast(e.message)).finally(() => el._loading = false);
    }
    return;
  }
  const key = j.id + ':' + state.ts;
  if (el._bodyKey !== key) { el._bodyKey = key; renderBody(body, d); }
}
function renderBody(body, d) {
  const m = d.meta || {};
  const dl = FORMATS.map(f => `<a class="btn" href="/api/jobs/${d.id}/export?fmt=${f}&timestamps=${state.ts}" download>${f.toUpperCase()}</a>`).join('');
  const media = [
    d.files?.video ? `<a class="btn" href="/api/jobs/${d.id}/video?download=true" download>Video (mp4)</a>` : '',
    d.files?.cover ? `<a class="btn" href="/api/jobs/${d.id}/cover" download="cover.jpg">Cover</a>` : '',
  ].join('');
  const content = !d.text ? `<p style="color:var(--muted);font-style:italic">No speech detected — this video may be music-only or silent.</p>`
    : state.ts ? d.segments.map(s => `<div class="seg"><time>${fmtDur(s.start)}</time><span>${esc(s.text)}</span></div>`).join('')
    : `<p>${esc(d.text)}</p>`;
  const stats = [m.like_count != null ? `♥ ${fmtNum(m.like_count)}` : '', m.comment_count != null ? `💬 ${fmtNum(m.comment_count)}` : '',
    m.upload_date ? `${m.upload_date.slice(0,4)}-${m.upload_date.slice(4,6)}-${m.upload_date.slice(6,8)}` : '', `model: ${esc(d.model)}`].filter(Boolean).join(' · ');
  body.innerHTML = `
    <div class="tools">
      <label><input type="checkbox" data-act="ts" ${state.ts ? 'checked' : ''}> Timestamps</label>
      <button class="btn" data-act="copy">Copy text</button>
      <span class="grp"><span class="lbl">Download</span>${dl}</span>
      ${media ? `<span class="grp">${media}</span>` : ''}
    </div>
    <div class="transcript">${content}</div>
    <div class="meta-line"><span>${stats}</span><a href="${esc(safeHref(m.webpage_url || d.url))}" target="_blank" rel="noopener noreferrer">Open original ↗</a></div>`;
}

// ---------- events (delegated)
$('#list').addEventListener('click', async e => {
  const card = e.target.closest('.card'); if (!card) return;
  const id = card.dataset.id, job = state.jobs.find(j => j.id === id); if (!job) return;
  const act = e.target.closest('[data-act]')?.dataset.act;
  try {
    if (act === 'pick') { e.target.checked ? state.selected.add(id) : state.selected.delete(id); card._sig = null; render(); return; }
    if (act === 'star') { await api('/api/jobs/' + id, { method: 'PATCH', body: JSON.stringify({ starred: !job.starred }) }); return refresh(); }
    if (act === 'del') {
      if (!confirm('Delete this transcript and its saved files?')) return;
      await api('/api/jobs/' + id, { method: 'DELETE' }); state.expanded.delete(id); state.details.delete(id); return refresh();
    }
    if (act === 'retry') { await api(`/api/jobs/${id}/retry`, { method: 'POST' }); return refresh(); }
    if (act === 'ts') { state.ts = e.target.checked; return render(); }
    if (act === 'copy') {
      const d = state.details.get(id);
      const text = state.ts ? d.segments.map(s => `[${fmtDur(s.start)}] ${s.text}`).join('\n') : d.text;
      await navigator.clipboard.writeText(text); return toast('Copied to clipboard');
    }
    if (e.target.closest('.row') && job.status === 'done' && !e.target.closest('a,button,input')) {
      state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id); render();
    }
  } catch (err) { toast(err.message, 6000); }
});

$('#f-all').onclick = () => setFilter(false);
$('#f-star').onclick = () => setFilter(true);
function setFilter(starred) {
  state.starred = starred; $('#f-all').classList.toggle('on', !starred); $('#f-star').classList.toggle('on', starred); refresh();
}
let qTimer; $('#q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value.trim(); refresh(); }, 250); });
$('#sel-all').onclick = () => {
  const done = state.jobs.filter(j => j.status === 'done');
  const all = done.length && done.every(j => state.selected.has(j.id));
  done.forEach(j => all ? state.selected.delete(j.id) : state.selected.add(j.id));
  document.querySelectorAll('.card').forEach(c => c._sig = null); render();
};
$('#bulk').onclick = () => {
  const ids = [...state.selected].join(',');
  const a = document.createElement('a');
  a.href = `/api/export.zip?ids=${encodeURIComponent(ids)}&fmt=${$('#bulk-fmt').value}&timestamps=${state.ts}`;
  a.download = 'transcripts.zip'; document.body.appendChild(a); a.click(); a.remove();
};

(async () => { restoreOpts(); await loadModels().catch(e => toast(e.message)); refresh(); })();
</script>
</body>
</html>
